mainIds":["D-12","D-05"],"formulaLatex":"x_{n+1}=x_n-\\frac{f(x_n)}{f\\prime(x_n)}","resultKind":"ALGORITHM","reversible":false,"relatedIds":["B-09.03","B-12.01","B-12.09"],"prerequisites":[],"example":{"formulaLatex":"f(x)=x^2-2,\\quad x_0=1","steps":[{"formulaLatex":"x_{n+1}=\\frac12\\left(x_n+\\frac2{x_n}\\right)"},{"formulaLatex":"x_1=\\frac32,\\quad x_2=\\frac{17}{12}"},{"formulaLatex":"f(17/12)=\\frac1{144},\\quad|17/12-\\sqrt2|=\\frac{1/144}{17/12+\\sqrt2}"}]},"sources":["docs/atlante_ponti_matematici-ITA.md"],"status":"review"},{"id":"B-12.09","kind":"bridge","parentId":"B-12","level":3,"domainIds":["D-04","D-12"],"formulaLatex":"\\|x-\\widetilde x\\|\\le\\|A^{-1}\\|\\,\\|b-A\\widetilde x\\|","resultKind":"BOUND_ONLY","reversible":false,"relatedIds":["B-02.08","B-11.06"],"prerequisites":[],"example":{"formulaLatex":"A=\\operatorname{diag}(1,10^{-6}),\\quad b=(1,10^{-6}),\\quad\\widetilde x=(1,0)","steps":[{"formulaLatex":"r=b-A\\widetilde x=(0,10^{-6})"},{"formulaLatex":"x=(1,1),\\quad\\|x-\\widetilde x\\|_2=1"},{"formulaLatex":"\\|A^{-1}\\|_2\\|r\\|_2=10^6\\cdot10^{-6}=1"}]},"sources":["docs/atlante_ponti_matematici-ITA.md"],"status":"review"},{"id":"B-12.11","kind":"bridge","parentId":"B-12","level":1,"domainIds":["D-02","D-12"],"formulaLatex":"\\text{candidate }r:\\quad L(r)-R(r)=0","resultKind":"ALGORITHM","reversible":false,"relatedIds":["B-02.06","B-02.04","B-12.09"],"prerequisites":[],"example":{"formulaLatex":"\\sqrt{x+2}=x,\\quad r=-1","steps":[{"formulaLatex":"\\sqrt{-1+2}=1\\ne-1"},{"formulaLatex":"r=-1\\text{ is rejected},\\qquad\\sqrt{2+2}=2"}]},"sources":["docs/atlante_ponti_matematici-ITA.md"],"status":"review"}],"routes":[{"id":"R-ALG","bridgeIds":["B-02.02","B-02.01","B-02.03","B-01.04","B-12.11"]},{"id":"R-HILBERT","bridgeIds":["B-01.04","B-05.01","B-05.03","B-05.04","B-01.07","B-05.06","B-03.13","B-04.05"]},{"id":"R-ODE","bridgeIds":["B-03.07","B-04.07","B-04.05"]},{"id":"R-NUM","bridgeIds":["B-09.01","B-12.01","B-12.02","B-12.09"]}]},"locales":{"en":{"categories":{"B-01":{"title":"Extend the universe","summary":"When the current number system or space is too small."},"B-02":{"title":"Rewrite & simplify","summary":"Find a useful form while tracking the solution set."},"B-03":{"title":"Separate & decompose","summary":"Break a problem into simpler, independent parts."},"B-04":{"title":"Change representation","summary":"Make difficult operations simpler in another representation."},"B-05":{"title":"Geometry & duality","summary":"Use conjugation, orthogonality and dual descriptions."},"B-06":{"title":"Local to global","summary":"Connect derivatives, boundaries and global quantities."},"B-07":{"title":"Approximate & linearize","summary":"Trade exact formulas for controlled approximations."},"B-08":{"title":"Exchange infinite operations","summary":"Check when limits, sums and integrals may be exchanged."},"B-09":{"title":"Existence & uniqueness","summary":"Establish that a solution exists before calculating it."},"B-10":{"title":"Bound & control","summary":"Control a quantity using inequalities and estimates."},"B-11":{"title":"Optimize & vary","summary":"Connect equations, energy and minimization."},"B-12":{"title":"Compute & verify","summary":"Turn theory into algorithms and check their answers."}},"domains":{"D-01":{"title":"Numbers & complex numbers"},"D-02":{"title":"Symbolic algebra"},"D-03":{"title":"Geometry & trigonometry"},"D-04":{"title":"Linear algebra"},"D-05":{"title":"Calculus"},"D-07":{"title":"Measure & function spaces"},"D-08":{"title":"Differential equations"},"D-09":{"title":"Complex analysis"},"D-10":{"title":"Hilbert spaces & operators"},"D-12":{"title":"Optimization & numerics"}},"bridges":{"B-01.04":{"title":"Extend to complex numbers","summary":"Find roots that do not exist over the reals.","when":"A real quadratic has a negative discriminant.","hypotheses":["Complex solutions are permitted by the problem."],"guarantees":"Every nonconstant complex polynomial has a complex root.","pitfalls":"Changing the domain changes the problem: a complex root is not a real solution.","steps":["Isolate the square.","Use i² = −1 and keep both roots.","Substitute both roots into the original equation."]},"B-01.07":{"title":"Complete an inner product space","summary":"Add the missing limits of Cauchy sequences.","when":"A space has geometry but is not complete in its induced norm.","hypotheses":["A positive definite inner product is defined","Use its induced norm for completion."],"guarantees":"A dense isometric embedding into a Hilbert space, unique up to isometry.","pitfalls":"L² convergence need not imply convergence at every point.","steps":["The limit is a discontinuous step function (up to a null set).","The error tends to zero; the limit belongs to L²."]},"B-02.01":{"title":"Factor an expression","summary":"Turn a polynomial into a product of simpler factors.","when":"You need the roots of a polynomial or a useful cancellation.","hypotheses":["Factorization is an identity over the chosen field","For the zero-product rule, work over a field such as ℝ or ℂ."],"guarantees":"The polynomial and its factorization have the same values and roots.","pitfalls":"Canceling a factor in a fraction still requires excluding its zeros.","steps":["Find two numbers with sum −5 and product 6.","A product is zero only if a factor is zero.","Check both roots in the original polynomial."]},"B-02.02":{"title":"Collect terms & isolate","summary":"Combine like terms and isolate an unknown.","when":"The unknown appears linearly.","hypotheses":["Add the same expression to both sides","Divide only by a known nonzero coefficient."],"guarantees":"Reversible steps preserve the solution set.","pitfalls":"If the coefficient is zero, distinguish an identity from a contradiction.","steps":["Subtract 6 from both sides.","Divide by 3, which is nonzero.","Verify by substitution."]},"B-02.03":{"title":"Complete the square","summary":"Rewrite a quadratic as a shifted square.","when":"Factoring is difficult, or you want to see the discriminant.","hypotheses":["The quadratic coefficient a is nonzero","Choose the required real or complex domain."],"guarantees":"An exact identity leading to the quadratic formula.","pitfalls":"Keep both square-root signs; a negative discriminant has no real roots.","steps":["Add 9 after moving the constant.","Recognize the perfect square.","Take both square roots and isolate x.","Check both solutions."]},"B-02.04":{"title":"Clear denominators","summary":"Replace a rational equation with a polynomial on its domain.","when":"Fractions hide a simpler polynomial equation.","hypotheses":["Record every original denominator","Exclude their zeros before multiplying."],"guarantees":"Equivalent equations on the restricted domain.","pitfalls":"Simplification must not restore excluded inputs.","steps":["Record the original denominator restriction.","Find candidates from the numerator.","Discard 1; only −1 satisfies the original equation."]},"B-02.05":{"title":"Divide with a case split","summary":"Separate the zero case before canceling an unknown factor.","when":"You are about to divide by a variable expression.","hypotheses":["The divisor must be nonzero on the branch where division is used."],"guarantees":"The union of the zero and nonzero branches preserves all solutions.","pitfalls":"Dividing by x immediately loses the possible root x = 0.","steps":["Bring all terms to one side and factor.","Treat the zero factor and the nonzero branch.","Both roots satisfy the original equation."]},"B-02.06":{"title":"Square both sides","summary":"Remove a radical and generate candidate solutions.","when":"An equation contains square roots.","hypotheses":["For real square roots, the radicand is nonnegative","Check the sign of the other side","Verify all candidates in the original equation."],"guarantees":"Every original solution survives squaring; the converse needs checking.","pitfalls":"Squaring can introduce extraneous roots.","steps":["The square root is nonnegative, so x must be too.","Square to obtain candidates 2 and −1.","Reject −1 and verify 2 in the original equation."]},"B-02.07":{"title":"Substitute a new variable","summary":"Reveal a familiar equation inside an unfamiliar one.","when":"Repeated powers or a repeated expression hide a simpler structure.","hypotheses":["Track the range of the substitution","Recover every permitted original value from each new value."],"guarantees":"An equivalent problem when the range and inverse branches are retained.","pitfalls":"For u = x² over ℝ, negative u has no preimage and positive u usually has two.","steps":["Replace the repeated square by u.","Factor the quadratic.","Invert x² = 1 and x² = 4, keeping both signs.","All four candidates satisfy the original even polynomial."]},"B-02.08":{"title":"Gaussian elimination","summary":"Use reversible row operations to solve linear systems.","when":"Several unknowns appear linearly.","hypotheses":["Swap rows, add multiples, or scale by a nonzero number","Track pivots and any parameter cases."],"guarantees":"An equivalent linear system with the same solution set.","pitfalls":"A zero pivot may require a row swap; a zero row does not automatically mean inconsistency.","steps":["Eliminate x from the second row.","Back-substitute into the first equation.","Check both equations."]},"B-03.05":{"title":"Fubini & Tonelli","summary":"Replace a product integral by iterated integrals.","when":"A multivariable integral becomes easier one variable at a time.","hypotheses":["Measurability on σ-finite product measure spaces","Fubini: absolute integrability","Tonelli: nonnegative integrand, possibly infinite integral."],"guarantees":"The iterated and product integrals agree under the appropriate theorem.","pitfalls":"Conditional convergence alone does not justify exchanging integration order.","steps":["The integrand is continuous and nonnegative on a compact square.","The product integrand and product domain allow factorization.","Direct iterated integration confirms the value."]},"B-03.07":{"title":"Separate variables","summary":"Turn a separable differential equation into two integrals.","when":"The derivative is a product of a function of x and a function of y.","hypotheses":["Work where h(y) is nonzero","Check constant solutions h(y) = 0 separately","Retain initial conditions and solution intervals."],"guarantees":"An implicit solution on each valid branch.","pitfalls":"Division can lose equilibrium solutions.","steps":["On the nonzero branch, separate the variables.","Integrate and exponentiate; y = 0 is also an equilibrium.","The initial condition selects K = 1; verify the derivative."]},"B-03.12":{"title":"Diagonalize a normal matrix","summary":"Decouple a linear operator into orthogonal eigenmodes.","when":"Powers or coupled linear systems are difficult in the current basis.","hypotheses":["A is a finite-dimensional complex normal matrix: A*A = AA*."],"guarantees":"A unitary eigenbasis exists; Hermitian matrices have real eigenvalues.","pitfalls":"Not every matrix is diagonalizable, or unitarily diagonalizable.","steps":["Choose orthonormal eigenvectors of this symmetric matrix.","Verify the two eigenvalues directly.","The transformed operator acts separately on each coordinate."]},"B-03.13":{"title":"Fourier series","summary":"Represent a periodic L² function by orthonormal modes.","when":"You need frequency coordinates or a finite-mode approximation.","hypotheses":["f belongs to L²([−π, π])","Use the complete basis eₙ(x) = exp(inx)/√(2π)."],"guarantees":"The series converges in L² norm and Parseval preserves energy.","pitfalls":"L² convergence does not guarantee convergence everywhere or uniformly.","steps":["Euler’s identity gives exactly two modes.","Account for the normalized basis.","Verify Parseval by integrating cos² on [−π, π]."]},"B-04.01":{"title":"Use polar coordinates","summary":"Expose radial symmetry and simplify planar integrals.","when":"The expression depends on x² + y² or the region is circular.","hypotheses":["Choose a domain that handles angle branches and the origin","Use the Jacobian r for area integrals."],"guarantees":"An equivalent coordinate description with the correct measure.","pitfalls":"Forgetting the Jacobian changes the integral.","steps":["The disk becomes a rectangle in (r, θ) parameters.","Include r and integrate; this agrees with the disk area."]},"B-04.05":{"title":"Fourier transform","summary":"Turn differentiation into multiplication in frequency.","when":"A constant-coefficient differential operator is hard to invert.","hypotheses":["For the classical derivative rule, sufficient regularity and decay","Use a function space and inversion theorem appropriate to the problem."],"guarantees":"Under f̂(ξ) = ∫f(x)e^(−iξx) dx, derivatives become algebraic multipliers.","pitfalls":"Boundary conditions, multiplier zeros and inverse-transform hypotheses still matter.","steps":["Transform the second derivative with the stated convention.","The multiplier never vanishes on the real axis.","Verify in frequency; invert in a suitable space, for example for Schwartz data."]},"B-04.06":{"title":"Convolution to multiplication","summary":"Replace a convolution integral by a pointwise product.","when":"A linear filter or integral equation contains a convolution.","hypotheses":["For the standard classical theorem, f and g are in L¹(ℝ)","Fix the Fourier normalization."],"guarantees":"The transform of a convolution equals the product of transforms.","pitfalls":"The transform of a product is a convolution with a normalization factor.","steps":["Direct integration runs from 0 to x when x ≥ 0.","Direct transforms verify the convolution identity."]},"B-04.07":{"title":"Laplace transform","summary":"Solve an initial-value ODE in an algebraic domain.","when":"An ODE has initial data and a useful Laplace transform.","hypotheses":["Suitable regularity and exponential order","Work in a half-plane of convergence","Retain initial data in derivative transforms."],"guarantees":"The transformed equation encodes the ODE together with its initial value.","pitfalls":"Dropping the initial-value term changes the problem.","steps":["Transform the equation with y(0) = 0.","Solve algebraically and decompose into partial fractions.","Invert and verify the ODE and initial value."]},"B-04.11":{"title":"Euler’s identity","summary":"Connect rotations, trigonometry and complex exponentials.","when":"Trigonometric products or rotations are awkward.","hypotheses":["θ is real in the geometric interpretation","Angles are identified modulo 2π for a unit complex number."],"guarantees":"An exact identity converting trigonometric and exponential expressions.","pitfalls":"The argument is not a globally unique inverse of the complex exponential.","steps":["Expand the product using Euler’s identity.","Compare real parts to recover the addition formula.","Check a concrete pair of angles."]},"B-05.01":{"title":"Use the complex conjugate","summary":"Connect complex arithmetic to nonnegative real quantities.","when":"You need to divide complex numbers or compute a modulus.","hypotheses":["For inversion, z is nonzero","Conjugation is antilinear over ℂ."],"guarantees":"Multiplication by the conjugate gives the squared modulus.","pitfalls":"Conjugating a complex scalar also conjugates any coefficient multiplying it.","steps":["Multiply numerator and denominator by the conjugate.","The denominator is the squared modulus.","Multiplication verifies the reciprocal."]},"B-05.03":{"title":"Hermitian inner product","summary":"Build positive geometry on complex vectors.","when":"The naive bilinear dot product gives a negative squared length.","hypotheses":["Vectors belong to the same complex inner product space","This atlas uses linearity in the second argument."],"guarantees":"Conjugate symmetry, positive definiteness and a real nonnegative squared norm.","pitfalls":"Other books use the opposite convention; projection formulas must match.","steps":["Conjugate the first vector before multiplying.","The squared norm is positive.","The inner product certifies orthogonality and length."]},"B-05.04":{"title":"Orthogonal projection","summary":"Find the closest point on a line using an inner product.","when":"You need a best approximation or an orthogonal decomposition.","hypotheses":["u is nonzero","Use a consistent inner product convention."],"guarantees":"The residual is orthogonal to u and the projection minimizes the distance to v on span(u).","pitfalls":"A projection loses information: the original vector cannot be recovered from it alone.","steps":["Compute numerator and denominator using the conjugate.","The projection coefficient is 1.","Orthogonality verifies the best approximation."]},"B-05.06":{"title":"Riesz representation","summary":"Represent a continuous linear functional by a unique vector.","when":"A functional is easier to understand geometrically.","hypotheses":["H is a Hilbert space","F is linear and continuous","Use linearity in the second inner product argument."],"guarantees":"There is a unique representing vector v with ‖F‖ = ‖v‖.","pitfalls":"An arbitrary normed space need not have this inner product representation.","steps":["Choose v so its conjugated components are the coefficients of F.","Check the representation for an arbitrary vector x."]},"B-05.07":{"title":"Adjoint operator","summary":"Move an operator across the inner product.","when":"You need self-adjointness, normality or an operator’s dual action.","hypotheses":["A is a bounded linear operator on a Hilbert space","For matrices, use the Hermitian inner product."],"guarantees":"The adjoint exists uniquely; in finite dimensions it is the conjugate transpose.","pitfalls":"For unbounded operators the adjoint’s domain is part of the definition.","steps":["Transpose and conjugate every entry.","This identity verifies the defining inner product property."]},"B-06.03":{"title":"Divergence theorem","summary":"Replace boundary flux by a volume integral.","when":"Parametrizing the boundary is harder than differentiating the field.","hypotheses":["A bounded region with sufficiently regular boundary","A sufficiently regular vector field","Use the outward normal."],"guarantees":"The total outward flux equals the integral of divergence.","pitfalls":"An inward normal reverses the flux sign.","steps":["Differentiate the two components.","Multiply by the area of the unit disk.","Direct boundary integration confirms the result."]},"B-06.05":{"title":"Residue theorem","summary":"Turn a contour integral into a sum at poles.","when":"Complex singularities simplify an otherwise difficult integral.","hypotheses":["f is meromorphic inside and on a positively oriented simple closed contour","Only finitely many poles lie inside and none on the contour."],"guarantees":"The contour integral is determined by the enclosed residues.","pitfalls":"For real improper integrals, justify contributions from added contour segments.","steps":["The only pole inside the contour is simple.","Apply the theorem for counterclockwise orientation.","Uniform convergence on the circle allows termwise integration; only 1/z contributes."]},"B-07.02":{"title":"Taylor polynomial with remainder","summary":"Approximate a function while controlling the error.","when":"A local polynomial is easier to calculate than the original function.","hypotheses":["Sufficient differentiability on the interval between a and x","Bound the next derivative to control the Lagrange remainder."],"guarantees":"A finite polynomial plus an exact remainder; a derivative bound gives an error estimate.","pitfalls":"Smoothness alone does not imply equality with the infinite Taylor series.","steps":["Use the degree-two polynomial about 0.","On [0, 0.2], the third derivative is at most e^0.2.","The result is an interval, not an asserted exact decimal."]},"B-08.01":{"title":"Dominated convergence","summary":"Justify moving a limit inside an integral.","when":"Pointwise limits are easy but integrals depend on n.","hypotheses":["Measurable functions converge almost everywhere","One integrable g dominates every abs(fₙ) almost everywhere."],"guarantees":"The integrals converge and ‖fₙ − f‖₁ tends to zero.","pitfalls":"A different bound for every n is insufficient: the dominator must be uniform.","steps":["Convergence fails at x = 1 only, a null set; 1 is integrable.","Apply dominated convergence.","The explicit integral verifies the limit."]},"B-09.01":{"title":"Intermediate value theorem","summary":"Guarantee a real root by a change of sign.","when":"You need to prove a root exists or bracket it for bisection.","hypotheses":["f is continuous on [a, b]","Endpoint values have opposite signs."],"guarantees":"At least one root lies inside the interval.","pitfalls":"A sign change across a discontinuity does not guarantee a root; uniqueness is not implied.","steps":["The polynomial is continuous and changes sign.","Existence follows without a closed-form root.","An additional monotonicity argument proves uniqueness on this interval."]},"B-09.03":{"title":"Banach fixed point theorem","summary":"Turn a contraction into a unique solution and a convergent iteration.","when":"An equation can be written x = T(x).","hypotheses":["A nonempty complete metric space X","T maps all of X into X","A uniform contraction constant 0 ≤ q \u003c 1."],"guarantees":"A unique fixed point; every iteration from X converges with an explicit error bound.","pitfalls":"A small derivative at one point is not a uniform contraction estimate.","steps":["Check invariance, completeness and a uniform contraction bound.","Iterate from any point of [0, 1].","This posterior bound certifies error, unlike decimal stability alone."]},"B-09.09":{"title":"Lax–Milgram theorem","summary":"Establish a unique weak solution in a Hilbert space.","when":"A PDE is better expressed through test functions.","hypotheses":["H is a real Hilbert space","a is bilinear, continuous and coercive","F is a continuous linear functional."],"guarantees":"There is a unique weak solution u in H.","pitfalls":"A weak solution is not automatically a classical solution; extra regularity needs proof.","steps":["Choose the Sobolev space and use its derivative norm.","Cauchy–Schwarz and Poincaré give continuity.","Coercivity gives a unique weak solution; the variational identity is its verification criterion."]},"B-10.02":{"title":"Cauchy–Schwarz inequality","summary":"Bound an inner product by the product of lengths.","when":"You need an estimate, continuity or an error bound.","hypotheses":["A real or complex inner product space."],"guarantees":"A universal bound; equality exactly for linearly dependent vectors, including zero cases.","pitfalls":"This is a bound, not a formula for the actual inner product.","steps":["Compute the quantities in the bound.","Squaring nonnegative sides verifies the inequality."]},"B-11.05":{"title":"Euler–Lagrange equation","summary":"Find the differential equation of a stationary curve.","when":"A problem asks for a curve minimizing an integral functional.","hypotheses":["Sufficient regularity of the Lagrangian and candidate curve","Fixed endpoint variations vanish at the boundary","The candidate is an interior stationary point."],"guarantees":"A necessary stationarity equation; further conditions are needed for a minimum.","pitfalls":"Solving Euler–Lagrange alone does not prove a global minimum.","steps":["The stationary candidates are straight lines.","The endpoint values determine the line.","A separate nonnegative energy calculation verifies the global minimum."]},"B-11.06":{"title":"Least squares by projection","summary":"Project data onto the range of a matrix.","when":"An overdetermined linear system has no exact solution.","hypotheses":["Finite-dimensional real or complex Euclidean spaces","Full column rank is required for a unique coefficient vector."],"guarantees":"A best approximation exists and its residual is orthogonal to the column space.","pitfalls":"Normal equations can worsen conditioning; QR or SVD is often preferable numerically.","steps":["Solve the normal equation.","Orthogonality certifies the least-squares solution.","Completing the square directly verifies the unique minimum."]},"B-12.01":{"title":"Bisection","summary":"Repeatedly halve a bracket containing a real root.","when":"You have a continuous function and a sign-changing interval.","hypotheses":["Continuity on the initial closed interval","Opposite nonzero endpoint signs, or handle endpoint roots first."],"guarantees":"A nested root bracket; the midpoint error is at most half the interval width.","pitfalls":"Without continuity a sign change can hide a pole instead of a root.","steps":["The positive midpoint value keeps the left half.","The endpoint signs still differ.","The new midpoint has a certified error bound."]},"B-12.02":{"title":"Newton’s method","summary":"Follow tangent lines toward a root.","when":"A differentiable equation has no convenient exact solution.","hypotheses":["Nonzero derivative at each iterate","For local quadratic convergence, sufficient smoothness near a simple root and a sufficiently close initial guess."],"guarantees":"Under local hypotheses, fast convergence to a simple root.","pitfalls":"Poor starting points, zero derivatives or multiple roots can spoil convergence.","steps":["Insert f and its derivative into Newton’s rule.","Compute two iterates.","A residual plus the factorization of the error verifies progress."]},"B-12.09":{"title":"Residual & conditioning","summary":"Relate an approximate solution’s residual to its error.","when":"A numerical answer seems accurate because the residual is small.","hypotheses":["A is invertible","Use compatible matrix and vector norms","Estimate the inverse norm or condition number."],"guarantees":"A posterior error control that accounts for sensitivity.","pitfalls":"A tiny residual can coexist with a large solution error in an ill-conditioned problem.","steps":["The residual is very small.","Yet the actual error has size 1.","The inverse norm explains and bounds the error exactly here."]},"B-12.11":{"title":"Verify in the original equation","summary":"Check candidates against the original expression and domain.","when":"A transformation, cancellation or symbolic engine produced roots.","hypotheses":["The candidate lies in the original domain","Every original expression is defined","Exact substitution gives zero residual, or numerical error is controlled."],"guarantees":"Each checked candidate is a solution; completeness requires a separate argument.","pitfalls":"A numerical residual near zero alone is not an exact proof or a complete root list.","steps":["Substitute into the original equation, not the squared one.","Reject the extraneous root and verify the valid root 2."]}},"routes":{"R-ALG":{"title":"From equation to checked roots"},"R-HILBERT":{"title":"From imaginary numbers to Hilbert"},"R-ODE":{"title":"From derivatives to algebra"},"R-NUM":{"title":"From existence to approximation"}},"ui":{"appName":"Math Bridges","subtitle":"An atlas for mathematical thinking","explore":"Explore bridges","map":"Map view","solver":"Equation lab","routes":"Learning paths","compare":"Compare pins","search":"Search a method, formula or obstacle…","searchLabel":"Search the atlas","clear":"Clear","allLevels":"All levels","level":"Level","allFamilies":"All families","families":"By purpose","disciplines":"By discipline","browse":"Browse the atlas","introLabel":"MAKE THE NEXT CONNECTION","introTitle":"A different view.\nA simpler problem.","introText":"Find the transformation that makes your problem click. Explore methods, check their conditions, and connect the ideas behind the equations.","bridgeCount":"bridges","familyCount":"families","languages":"languages","featured":"A good place to start","allBridges":"The bridge library","results":"results","noResults":"No bridges match these filters. Try another term or clear the filter il limite appartiene a L²."]},"B-02.01":{"title":"Fattorizzare un’espressione","summary":"Trasformare un polinomio in un prodotto di fattori semplici.","when":"Cerchi le radici di un polinomio o una cancellazione utile.","hypotheses":["La fattorizzazione è un’identità nel campo scelto","Per la legge di annullamento del prodotto, lavora su un campo come ℝ o ℂ."],"guarantees":"Il polinomio e la sua fattorizzazione hanno gli stessi valori e le stesse radici.","pitfalls":"Cancellare un fattore in una frazione richiede comunque di escluderne gli zeri.","steps":["Trova due numeri con somma −5 e prodotto 6.","Un prodotto è nullo solo se almeno un fattore è nullo.","Verifica entrambe le radici nel polinomio originale."]},"B-02.02":{"title":"Raccogliere e isolare","summary":"Raccogliere termini simili e isolare l’incognita.","when":"L’incognita compare linearmente.","hypotheses":["Somma la stessa espressione a entrambi i membri","Dividi solo per un coefficiente certamente non nullo."],"guarantees":"I passaggi reversibili conservano l’insieme delle soluzioni.","pitfalls":"Se il coefficiente è zero, distingui un’identità da una contraddizione.","steps":["Sottrai 6 a entrambi i membri.","Dividi per 3, che è diverso da zero.","Verifica per sostituzione."]},"B-02.03":{"title":"Completare il quadrato","summary":"Riscrivere una quadratica come quadrato traslato.","when":"La fattorizzazione è difficile o vuoi riconoscere il discriminante.","hypotheses":["Il coefficiente quadratico a è diverso da zero","Scegli il dominio reale o complesso richiesto."],"guarantees":"Un’identità esatta che conduce alla formula risolutiva.","pitfalls":"Conserva entrambi i segni della radice; un discriminante negativo non dà radici reali.","steps":["Aggiungi 9 dopo aver spostato il termine noto.","Riconosci il quadrato perfetto.","Considera entrambe le radici e isola x.","Verifica entrambe le soluzioni."]},"B-02.04":{"title":"Eliminare i denominatori","summary":"Trasformare una razionale in polinomiale sul suo dominio.","when":"Le frazioni nascondono un’equazione polinomiale più semplice.","hypotheses":["Annota tutti i denominatori originali","Escludi i loro zeri prima di moltiplicare."],"guarantees":"Equazioni equivalenti sul dominio ristretto.","pitfalls":"La semplificazione non può riabilitare valori esclusi.","steps":["Annota la restrizione del denominatore originale.","Trova i candidati dal numeratore.","Scarta 1; solo −1 soddisfa l’equazione originale."]},"B-02.05":{"title":"Dividere distinguendo i casi","summary":"Separare il caso nullo prima di cancellare un fattore incognito.","when":"Stai per dividere per un’espressione variabile.","hypotheses":["Il divisore deve essere non nullo nel ramo in cui dividi."],"guarantees":"L’unione dei rami nullo e non nullo conserva tutte le soluzioni.","pitfalls":"Dividere subito per x perde la possibile radice x = 0.","steps":["Porta tutti i termini a un membro e fattorizza.","Considera il fattore nullo e il ramo non nullo.","Entrambe le radici soddisfano l’equazione originale."]},"B-02.06":{"title":"Elevare al quadrato","summary":"Eliminare un radicale e generare soluzioni candidate.","when":"Un’equazione contiene radici quadrate.","hypotheses":["Per radici reali, il radicando è non negativo","Controlla il segno dell’altro membro","Verifica tutti i candidati nell’equazione originale."],"guarantees":"Ogni soluzione originale sopravvive al quadrato; il ritorno va verificato.","pitfalls":"Il quadrato può introdurre radici spurie.","steps":["La radice è non negativa, quindi anche x deve esserlo.","Eleva al quadrato per ottenere i candidati 2 e −1.","Scarta −1 e verifica 2 nell’equazione originale."]},"B-02.07":{"title":"Sostituire una variabile","summary":"Riconoscere un’equazione familiare dentro una forma insolita.","when":"Potenze o espressioni ripetute nascondono una struttura più semplice.","hypotheses":["Controlla l’immagine della sostituzione","Recupera tutti i valori originali ammessi per ogni nuovo valore."],"guarantees":"Un problema equivalente conservando immagine e rami dell’inversa.","pitfalls":"Per u = x² in ℝ, u negativo non ha preimmagini e u positivo ne ha di solito due.","steps":["Sostituisci il quadrato ripetuto con u.","Fattorizza la quadratica.","Inverti x² = 1 e x² = 4, conservando entrambi i segni.","Tutti e quattro i candidati soddisfano il polinomio pari originale."]},"B-02.08":{"title":"Eliminazione di Gauss","summary":"Usare operazioni di riga reversibili per risolvere sistemi lineari.","when":"Più incognite compaiono linearmente.","hypotheses":["Scambia righe, somma multipli o moltiplica per numeri non nulli","Controlla pivot ed eventuali casi parametrici."],"guarantees":"Un sistema lineare equivalente con le stesse soluzioni.","pitfalls":"Un pivot nullo può richiedere uno scambio; una riga nulla non implica automaticamente incompatibilità.","steps":["Elimina x dalla seconda riga.","Sostituisci nella prima equazione.","Verifica entrambe le equazioni."]},"B-03.05":{"title":"Fubini e Tonelli","summary":"Sostituire un integrale prodotto con integrali iterati.","when":"Un integrale multivariato è più semplice una variabile alla volta.","hypotheses":["Misurabilità su spazi di misura prodotto σ-finiti","Fubini: integrabilità assoluta","Tonelli: integrando non negativo, anche con integrale infinito."],"guarantees":"Gli integrali iterati e prodotto coincidono sotto il teorema appropriato.","pitfalls":"La sola convergenza condizionata non giustifica lo scambio d’ordine.","steps":["L’integrando è continuo e non negativo su un quadrato compatto.","Integrando e dominio prodotto permettono la fattorizzazione.","L’integrazione iterata diretta conferma il valore."]},"B-03.07":{"title":"Separare le variabili","summary":"Trasformare un’equazione differenziale separabile in due integrali.","when":"La derivata è prodotto di una funzione di x e una di y.","hypotheses":["Lavora dove h(y) è non nullo","Controlla separatamente le soluzioni costanti h(y) = 0","Conserva dati iniziali e intervalli di soluzione."],"guarantees":"Una soluzione implicita su ciascun ramo valido.","pitfalls":"La divisione può perdere soluzioni di equilibrio.","steps":["Sul ramo non nullo, separa le variabili.","Integra ed esponenzia; anche y = 0 è un equilibrio.","Il dato iniziale sceglie K = 1; verifica la derivata."]},"B-03.12":{"title":"Diagonalizzare una matrice normale","summary":"Separare un operatore lineare in modi propri ortogonali.","when":"Potenze o sistemi accoppiati sono difficili nella base attuale.","hypotheses":["A è una matrice complessa normale finito-dimensionale: A*A = AA*."],"guarantees":"Esiste una base unitaria di autovettori; le matrici hermitiane hanno autovalori reali.","pitfalls":"Non ogni matrice è diagonalizzabile, né diagonalizzabile unitariamente.","steps":["Scegli autovettori ortonormali di questa matrice simmetrica.","Verifica direttamente i due autovalori.","L’operatore trasformato agisce separatamente su ogni coordinata."]},"B-03.13":{"title":"Serie di Fourier","summary":"Rappresentare una funzione periodica L² con modi ortonormali.","when":"Servono coordinate in frequenza o un’approssimazione a modi finiti.","hypotheses":["f appartiene a L²([−π, π])","Usa la base completa eₙ(x) = exp(inx)/√(2π)."],"guarantees":"La serie converge in norma L² e Parseval conserva l’energia.","pitfalls":"La convergenza L² non garantisce convergenza ovunque o uniforme.","steps":["L’identità di Eulero dà esattamente due modi.","Tieni conto della normalizzazione della base.","Verifica Parseval integrando cos² su [−π, π]."]},"B-04.01":{"title":"Usare coordinate polari","summary":"Riconoscere la simmetria radiale e semplificare integrali piani.","when":"L’espressione dipende da x² + y² o la regione è circolare.","hypotheses":["Scegli un dominio gestendo rami dell’angolo e origine","Usa il Jacobiano r negli integrali di area."],"guarantees":"Una descrizione equivalente con la misura corretta.","pitfalls":"Dimenticare il Jacobiano cambia l’integrale.","steps":["Il disco diventa un rettangolo nei parametri (r, θ).","Includi r e integra; il risultato coincide con l’area del disco."]},"B-04.05":{"title":"Trasformata di Fourier","summary":"Trasformare le derivate in moltiplicazioni in frequenza.","when":"Un operatore differenziale a coefficienti costanti è difficile da invertire.","hypotheses":["Per la regola classica, regolarità e decadimento sufficienti","Usa uno spazio funzionale e un teorema d’inversione appropriati."],"guarantees":"Con f̂(ξ) = ∫f(x)e^(−iξx) dx, le derivate diventano moltiplicatori algebrici.","pitfalls":"Condizioni al contorno, zeri dei moltiplicatori e ipotesi d’inversione restano essenziali.","steps":["Trasforma la derivata seconda con la convenzione dichiarata.","Il moltiplicatore non si annulla sull’asse reale.","Verifica in frequenza; inverti in uno spazio adatto, ad esempio per dati di Schwartz."]},"B-04.06":{"title":"Dalla convoluzione al prodotto","summary":"Sostituire un integrale di convoluzione con un prodotto puntuale.","when":"Un filtro lineare o un’equazione integrale contiene una convoluzione.","hypotheses":["Per il teorema classico standard, f e g appartengono a L¹(ℝ)","Fissa la normalizzazione di Fourier."],"guarantees":"La trasformata della convoluzione è il prodotto delle trasformate.","pitfalls":"La trasformata di un prodotto è una convoluzione con un fattore di normalizzazione.","steps":["L’integrale diretto va da 0 a x quando x ≥ 0.","Le trasformate dirette verificano l’identità di convoluzione."]},"B-04.07":{"title":"Trasformata di Laplace","summary":"Risolvere un problema iniziale ODE in un dominio algebrico.","when":"Un’ODE ha dati iniziali e una trasformata di Laplace utile.","hypotheses":["Regolarità e ordine esponenziale adeguati","Lavora in un semipiano di convergenza","Conserva i dati iniziali nelle trasformate delle derivate."],"guarantees":"L’equazione trasformata codifica ODE e dato iniziale.","pitfalls":"Omettere il termine iniziale cambia il problema.","steps":["Trasforma l’equazione con y(0) = 0.","Risolvi algebricamente e scomponi in fratti semplici.","Inverti e verifica ODE e dato iniziale."]},"B-04.11":{"title":"Identità di Eulero","summary":"Collegare rotazioni, trigonometria ed esponenziali complessi.","when":"Prodotti trigonometrici o rotazioni sono scomodi.","hypotheses":["θ è reale nell’interpretazione geometrica","Per un complesso unitario gli angoli si identificano modulo 2π."],"guarantees":"Un’identità esatta fra espressioni trigonometriche ed esponenziali.","pitfalls":"L’argomento non è un’inversa globalmente univoca dell’esponenziale complesso.","steps":["Espandi il prodotto usando l’identità di Eulero.","Confronta le parti reali per ritrovare la formula di addizione.","Verifica una coppia concreta di angoli."]},"B-05.01":{"title":"Usare il coniugato","summary":"Collegare l’aritmetica complessa a quantità reali non negative.","when":"Devi dividere complessi o calcolare un modulo.","hypotheses":["Per l’inversione, z è non nullo","Il coniugio è antilineare su ℂ."],"guarantees":"Il prodotto per il coniugato dà il modulo al quadrato.","pitfalls":"Coniugare uno scalare complesso coniuga anche i coefficienti che lo moltiplicano.","steps":["Moltiplica numeratore e denominatore per il coniugato.","Il denominatore è il modulo al quadrato.","Il prodotto verifica il reciproco."]},"B-05.03":{"title":"Prodotto hermitiano","summary":"Costruire una geometria positiva sui vettori complessi.","when":"Il prodotto bilineare ingenuo dà una lunghezza al quadrato negativa.","hypotheses":["I vettori appartengono allo stesso spazio con prodotto interno complesso","L’atlante usa la linearità nel secondo argomento."],"guarantees":"Simmetria coniugata, positività definita e norma al quadrato reale non negativa.","pitfalls":"Altri testi usano la convenzione opposta; le formule di proiezione devono essere coerenti.","steps":["Coniuga il primo vettore prima di moltiplicare.","La norma al quadrato è positiva.","Il prodotto interno certifica ortogonalità e lunghezza."]},"B-05.04":{"title":"Proiezione ortogonale","summary":"Trovare il punto più vicino su una retta con il prodotto interno.","when":"Serve un’approssimazione ottimale o una scomposizione ortogonale.","hypotheses":["u è non nullo","Usa una convenzione coerente per il prodotto interno."],"guarantees":"Il residuo è ortogonale a u e la proiezione minimizza la distanza da v su span(u).","pitfalls":"La proiezione perde informazione: da sola non permette di recuperare il vettore originale.","steps":["Calcola numeratore e denominatore usando il coniugato.","Il coefficiente di proiezione è 1.","L’ortogonalità verifica l’approssimazione ottimale."]},"B-05.06":{"title":"Rappresentazione di Riesz","summary":"Rappresentare un funzionale lineare continuo con un unico vettore.","when":"Un funzionale si comprende meglio geometricamente.","hypotheses":["H è uno spazio di Hilbert","F è lineare e continuo","Usa la linearità nel secondo argomento del prodotto interno."],"guarantees":"Esiste un unico vettore rappresentante v con ‖F‖ = ‖v‖.","pitfalls":"Uno spazio normato arbitrario può non avere questa rappresentazione tramite prodotto interno.","steps":["Scegli v affinché le componenti coniugate siano i coefficienti di F.","Verifica la rappresentazione per un vettore x arbitrario."]},"B-05.07":{"title":"Operatore aggiunto","summary":"Spostare un operatore da un argomento all’altro del prodotto interno.","when":"Servono autoaggiuntezza, normalità o azione duale di un operatore.","hypotheses":["A è un operatore lineare limitato su Hilbert","Per matrici, usa il prodotto hermitiano."],"guarantees":"L’aggiunto esiste ed è unico; in dimensione finita è la trasposta coniugata.","pitfalls":"Per operatori non limitati il dominio dell’aggiunto fa parte della definizione.","steps":["Trasponi e coniuga ogni elemento.","Questa identità verifica la proprietà definitoria del prodotto interno."]},"B-06.03":{"title":"Teorema della divergenza","summary":"Sostituire un flusso al bordo con un integrale nel volume.","when":"Parametrizzare il bordo è più difficile che derivare il campo.","hypotheses":["Una regione limitata con bordo sufficientemente regolare","Un campo vettoriale sufficientemente regolare","Usa la normale uscente."],"guarantees":"Il flusso uscente totale è l’integrale della divergenza.","pitfalls":"La normale entrante inverte il segno del flusso.","steps":["Deriva le due componenti.","Moltiplica per l’area del disco unitario.","L’integrazione diretta al bordo conferma il risultato."]},"B-06.05":{"title":"Teorema dei residui","summary":"Trasformare un integrale di contorno in una somma sui poli.","when":"Le singolarità complesse semplificano un integrale difficile.","hypotheses":["f è meromorfa dentro e su un contorno semplice chiuso orientato positivamente","I poli interni sono finiti e nessuno giace sul contorno."],"guarantees":"L’integrale di contorno è determinato dai residui interni.","pitfalls":"Per integrali reali impropri, giustifica i contributi dei tratti di contorno aggiunti.","steps":["L’unico polo interno è semplice.","Applica il teorema con orientazione antioraria.","La convergenza uniforme sul cerchio permette di integrare termine a termine; contribuisce solo 1/z."]},"B-07.02":{"title":"Polinomio di Taylor con resto","summary":"Approssimare una funzione controllando l’errore.","when":"Un polinomio locale è più facile da calcolare della funzione.","hypotheses":["Derivabilità sufficiente sull’intervallo fra a e x","Limita la derivata successiva per controllare il resto di Lagrange."],"guarantees":"Un polinomio finito più un resto esatto; una stima della derivata limita l’errore.","pitfalls":"La sola regolarità C∞ non implica uguaglianza con la serie infinita di Taylor.","steps":["Usa il polinomio di grado due centrato in 0.","Su [0, 0.2], la derivata terza è al più e^0.2.","Il risultato è un intervallo, non un decimale dichiarato esatto."]},"B-08.01":{"title":"Convergenza dominata","summary":"Giustificare il passaggio del limite sotto integrale.","when":"Il limite puntuale è semplice ma gli integrali dipendono da n.","hypotheses":["Funzioni misurabili convergono quasi ovunque","Un’unica g integrabile domina ogni abs(fₙ) quasi ovunque."],"guarantees":"Gli integrali convergono e ‖fₙ − f‖₁ tende a zero.","pitfalls":"Un limite diverso per ogni n non basta: il dominante deve essere uniforme.","steps":["La convergenza fallisce solo in x = 1, un insieme nullo; 1 è integrabile.","Applica la convergenza dominata.","L’integrale esplicito verifica il limite."]},"B-09.01":{"title":"Teorema dei valori intermedi","summary":"Garantire una radice reale tramite un cambio di segno.","when":"Vuoi dimostrare l’esistenza o racchiudere una radice per la bisezione.","hypotheses":["f è continua su [a, b]","I valori agli estremi hanno segno opposto."],"guarantees":"Almeno una radice si trova nell’intervallo aperto.","pitfalls":"Un cambio di segno attraverso una discontinuità non garantisce una radice; l’unicità non segue.","steps":["Il polinomio è continuo e cambia segno.","L’esistenza segue senza una formula chiusa per la radice.","Un ulteriore argomento di monotonia prova l’unicità in questo intervallo."]},"B-09.03":{"title":"Teorema del punto fisso di Banach","summary":"Ottenere una soluzione unica e un’iterazione convergente da una contrazione.","when":"Un’equazione può scriversi x = T(x).","hypotheses":["Uno spazio metrico X non vuoto e completo","T manda tutto X in X","Una costante di contrazione uniforme 0 ≤ q \u003c 1."],"guarantees":"Un unico punto fisso; ogni iterazione da X converge con stima esplicita dell’errore.","pitfalls":"Una derivata piccola in un punto non è una stima uniforme di contrazione.","steps":["Verifica invarianza, completezza e contrazione uniforme.","Itera da un punto qualsiasi di [0, 1].","Questa stima a posteriori certifica l’errore, diversamente dalla sola stabilità dei decimali."]},"B-09.09":{"title":"Teorema di Lax–Milgram","summary":"Dimostrare l’esistenza di un’unica soluzione debole in Hilbert.","when":"Una PDE si esprime meglio tramite funzioni test.","hypotheses":["H è uno spazio di Hilbert reale","a è bilineare, continua e coerciva","F è un funzionale lineare continuo."],"guarantees":"Esiste un’unica soluzione debole u in H.","pitfalls":"Una soluzione debole non è automaticamente classica; occorre provare ulteriore regolarità.","steps":["Scegli lo spazio di Sobolev e usa la norma della derivata.","Cauchy–Schwarz e Poincaré danno la continuità.","La coercività dà un’unica soluzione debole; l’identità variazionale è il criterio di verifica."]},"B-10.02":{"title":"Disuguaglianza di Cauchy–Schwarz","summary":"Limitare un prodotto interno col prodotto delle lunghezze.","when":"Serve una stima, continuità o un controllo dell’errore.","hypotheses":["Uno spazio con prodotto interno reale o complesso."],"guarantees":"Una stima universale; uguaglianza esattamente per vettori linearmente dipendenti, inclusi i casi nulli.","pitfalls":"È una stima, non una formula per il valore effettivo del prodotto interno.","steps":["Calcola le quantità nella stima.","Il quadrato dei membri non negativi verifica la disuguaglianza."]},"B-11.05":{"title":"Equazione di Eulero–Lagrange","summary":"Trovare l’equazione differenziale di una curva stazionaria.","when":"Il problema cerca una curva che minimizza un funzionale integrale.","hypotheses":["Regolarità sufficiente di lagrangiana e curva candidata","Le variazioni a estremi fissati si annullano al bordo","La candidata è un punto stazionario interno."],"guarantees":"Una condizione necessaria di stazionarietà; per un minimo servono altre condizioni.","pitfalls":"Risolvere Eulero–Lagrange da solo non prova un minimo globale.","steps":["Le candidate stazionarie sono rette.","I valori agli estremi determinano la retta.","Un calcolo separato con energia non negativa verifica il minimo globale."]},"B-11.06":{"title":"Minimi quadrati come proiezione","summary":"Proiettare i dati sull’immagine di una matrice.","when":"Un sistema sovradeterminato non ha soluzione esatta.","hypotheses":["Spazi euclidei reali o complessi finito-dimensionali","Per coefficienti unici occorre rango pieno per colonne."],"guarantees":"Esiste un’approssimazione ottimale con residuo ortogonale allo spazio delle colonne.","pitfalls":"Le equazioni normali possono peggiorare il condizionamento; numericamente sono spesso preferibili QR o SVD.","steps":["Risolvi l’equazione normale.","L’ortogonalità certifica la soluzione ai minimi quadrati.","Il completamento del quadrato verifica direttamente il minimo unico."]},"B-12.01":{"title":"Bisezione","summary":"Dimezzare ripetutamente un intervallo contenente una radice reale.","when":"Hai una funzione continua e un intervallo con cambio di segno.","hypotheses":["Continuità sull’intervallo chiuso iniziale","Segni opposti e non nulli agli estremi, oppure gestisci prima radici agli estremi."],"guarantees":"Intervalli annidati con una radice; l’errore del punto medio è al più metà della larghezza.","pitfalls":"Senza continuità un cambio di segno può nascondere un polo anziché una radice.","steps":["Il valore positivo al punto medio conserva la metà sinistra.","I segni agli estremi restano opposti.","Il nuovo punto medio ha una stima certificata dell’errore."]},"B-12.02":{"title":"Metodo di Newton","summary":"Seguire le tangenti verso una radice.","when":"Un’equazione derivabile non ha una soluzione esatta comoda.","hypotheses":["Derivata non nulla a ogni iterazione","Per convergenza quadratica locale, regolarità vicino a una radice semplice e un punto iniziale abbastanza vicino."],"guarantees":"Sotto ipotesi locali, convergenza rapida a una radice semplice.","pitfalls":"Punti iniziali sfavorevoli, derivate nulle o radici multiple possono compromettere la convergenza.","steps":["Inserisci f e la sua derivata nella regola di Newton.","Calcola due iterazioni.","Un residuo e la fattorizzazione dell’errore verificano il progresso."]},"B-12.09":{"title":"Residuo e condizionamento","summary":"Collegare residuo ed errore di una soluzione approssimata.","when":"Una risposta numerica sembra precisa perché il residuo è piccolo.","hypotheses":["A è invertibile","Usa norme compatibili per matrici e vettori","Stima la norma dell’inversa o il numero di condizionamento."],"guarantees":"Un controllo a posteriori dell’errore che tiene conto della sensibilità.","pitfalls":"Un residuo minuscolo può accompagnarsi a un grande errore in un problema mal condizionato.","steps":["Il residuo è molto piccolo.","Ma l’errore effettivo ha grandezza 1.","La norma dell’inversa spiega e limita esattamente l’errore in questo caso."]},"B-12.11":{"title":"Verificare nell’equazione originale","summary":"Controllare candidati nell’espressione e nel dominio originali.","when":"Una trasformazione, cancellazione o un motore simbolico ha prodotto radici.","hypotheses":["Il candidato appartiene al dominio originale","Ogni espressione originale è definita","La sostituzione esatta dà residuo nullo, oppure l’errore numerico è controllato."],"guarantees":"Ogni candidato verificato è una soluzione; la completezza richiede un argomento separato.","pitfalls":"Un residuo numerico quasi nullo non è da solo una prova esatta né un elenco completo delle radici.","steps":["Sostituisci nell’equazione originale, non in quella al quadrato.","Scarta la radice spuria e verifica la radice valida 2."]}},"routes":{"R-ALG":{"title":"Dall’equazione alle radici verificate"},"R-HILBERT":{"title":"Dai numeri immaginari a Hilbert"},"R-ODE":{"title":"Dalle derivate all’algebra"},"R-NUM":{"title":"Dall’esistenza all’approssimazione"}},"ui":{"appName":"Ponti Matematici","subtitle":"Un atlante per ragionare in matematica","explore":"Esplora i ponti","map":"Vista mappa","solver":"Laboratorio equazioni","routes":"Percorsi di studio","compare":"Confronta i pin","search":"Cerca un metodo, una formula o un ostacolo…","searchLabel":"Cerca nell’atlante","clear":"Cancella","allLevels":"Tutti i livelli","l ressione è troppo grande per il risolutore guidato. Semplificala prima.","timeout":"Il calcolo è durato troppo ed è stato interrotto. Prova un’espressione più semplice.","workerError":"Il motore simbolico non ha terminato il calcolo. Prova un’espressione più semplice.","stepNormalize":"Porta tutto a sinistra e semplifica.","stepFactor":"Fattorizza il numeratore. Le restrizioni sui denominatori restano valide.","stepLinear":"Isola la variabile usando un coefficiente non nullo.","stepQuadratic":"Usa la formula risolutiva; il discriminante determina radici reali o complesse.","stepSubstitution":"Riconosci una quadratica nel quadrato della variabile, poi recupera entrambi i segni.","stepRoots":"Genera radici polinomiali candidate con Algebrite.","stepSquare":"Eleva al quadrato per generare candidati, poi verifica l’equazione radicale originale.","stepVerify":"Sostituisci ogni candidato nei due membri originali e verifica ogni restrizione del dominio.","rootNote":"Sono accettati solo i candidati certificati nell’equazione originale. Un candidato non certificato richiede altri controlli; in tal caso l’elenco potrebbe essere incompleto.","powered":"Realizzato con Algebrite · KaTeX · Markmap","footer":"Comprendi il perché. Verifica quando. Scopri che cosa segue.","menu":"Mostra o nascondi la navigazione","copyLink":"Copia il link al ponte","copied":"Link copiato","copyFailed":"Copia l’indirizzo dal browser.","saved":"Salvato localmente","skip":"Vai al contenuto","browseAll":"Esplora tutti i ponti","enterEquation":"Inserisci un’equazione","path":"Percorso","overview":"Panoramica","review":"Stato editoriale: in attesa di revisione indipendente","mapLoading":"Caricamento mappa…","types":{"EXACT_EQUIVALENCE":"Equivalenza esatta","EXACT_IMPLICATION":"Implicazione unidirezionale","EXACT_REPRESENTATION":"Rappresentazione esatta","DOMAIN_EXTENSION":"Estensione del dominio","APPROX_WITH_ERROR":"Approssimazione con errore","EXISTENCE":"Esistenza","EXISTENCE_UNIQUENESS":"Esistenza e u
